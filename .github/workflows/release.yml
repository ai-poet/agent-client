name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          if [ ! -f desktop/cmd/sailry-desktop/mygo.json ]; then
            echo "::error::desktop/cmd/sailry-desktop/mygo.json not found for MyGo release"
            exit 1
          fi
          version=$(jq -r '.version // ""' desktop/cmd/sailry-desktop/mygo.json)
          if [ -z "$version" ]; then
            echo "::error::No version found in desktop/cmd/sailry-desktop/mygo.json"
            exit 1
          fi
          case "$version" in
            *-*)
              echo "::error::Prerelease version ${version} cannot be published to the stable appcast channel"
              exit 1
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match desktop/cmd/sailry-desktop/mygo.json version ${version}"
              exit 1
            fi
          fi

          app_name=$(jq -r '.name // ""' desktop/cmd/sailry-desktop/mygo.json)
          app_slug=$(jq -r '.slug // ""' desktop/cmd/sailry-desktop/mygo.json)
          bundle_id=$(jq -r '.identifier // ""' desktop/cmd/sailry-desktop/mygo.json)
          plist_build=$(jq -r '.macos.infoPlist.CFBundleVersion // ""' desktop/cmd/sailry-desktop/mygo.json)
          sparkle_pub=$(jq -r '.macos.infoPlist.SUPublicEDKey // ""' desktop/cmd/sailry-desktop/mygo.json)
          feed_url=$(jq -r '.updates.url // ""' desktop/cmd/sailry-desktop/mygo.json)
          link_version=$(sed -n 's/.*ProductVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' desktop/internal/link/compatibility.go | head -1)

          if [ "$app_name" != "CheapRouter" ] || [ "$app_slug" != "cheaprouter" ] || [ "$bundle_id" != "sh.waku" ]; then
            echo "::error::Identity mismatch in mygo.json (name=$app_name slug=$app_slug identifier=$bundle_id)"
            exit 1
          fi
          if [ "$link_version" != "$version" ]; then
            echo "::error::desktop/internal/link/compatibility.go ProductVersion (${link_version}) != mygo.json version (${version})"
            exit 1
          fi
          if [ -z "$sparkle_pub" ] || [ -z "$feed_url" ]; then
            echo "::error::mygo.json must configure macos.infoPlist.SUPublicEDKey and updates.url"
            exit 1
          fi

          IFS=. read -r v_major v_minor v_patch <<< "$version"
          build_number=$((10#$v_major * 1000000 + 10#$v_minor * 1000 + 10#$v_patch))
          if [ "$plist_build" != "$build_number" ] || [ "$build_number" -le 3008 ]; then
            echo "::error::CFBundleVersion (${plist_build}) must equal ${build_number} and exceed legacy build 3008"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Releasing MyGo version=$version tag=v$version build_number=$build_number"

      # A published release for this version is already the finished product,
      # so rebuilding it would burn 90 minutes and could replace artifacts
      # people have downloaded. A leftover draft is this workflow's own
      # output, so it does not count and gets overwritten as before.
      - name: Look for an existing published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null) || draft=missing
          if [ "$draft" = false ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published; skipping this run"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Go/MyGo two-hop release pipeline
  # Hop 1: Sparkle appcast.xml (macOS) + Inno Setup appcast-windows-*.xml
  # Hop 2: MyGo manifests (mygo/update-<os>-<arch>.json) + .tar.gz archives
  # ---------------------------------------------------------------------------

  mygo-macos:
    name: MyGo macOS (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: aarch64-apple-darwin
            os: macos-latest
            primary_appcast: true
          - arch: amd64
            triple: x86_64-apple-darwin
            os: macos-15-intel
            primary_appcast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Verify required signing secrets
        env:
          MYGO_UPDATE_PUBLIC_KEY: ${{ secrets.MYGO_UPDATE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          WAKU_SIGNING_IDENTITY: ${{ secrets.WAKU_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PRIMARY_APPCAST: ${{ matrix.primary_appcast }}
        run: |
          set -euo pipefail
          if [ -z "$MYGO_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::MYGO_UPDATE_PUBLIC_KEY secret is required for MyGo desktop release"
            exit 1
          fi
          if [ "$PRIMARY_APPCAST" = "true" ] && [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is required to sign first-hop macOS appcast.xml"
            exit 1
          fi
          if [ -n "$APPLE_CERTIFICATE" ]; then
            if [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$WAKU_SIGNING_IDENTITY" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "::error::APPLE_CERTIFICATE is set, so APPLE_CERTIFICATE_PASSWORD, WAKU_SIGNING_IDENTITY, and APPLE_TEAM_ID are all required"
              exit 1
            fi
          fi

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Install Rust (native libraries)
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/.runtime/native/darwin-${{ matrix.arch }}/cargo
            desktop/.runtime/native/darwin-${{ matrix.arch }}/turso-cargo
          key: mygo-macos-${{ matrix.arch }}-rust-1.98.0-${{ hashFiles('desktop/native/iroh/Cargo.lock', 'desktop/native/turso/Cargo.lock') }}
          restore-keys: |
            mygo-macos-${{ matrix.arch }}-rust-1.98.0-

      - name: Build native libraries
        working-directory: desktop
        run: |
          sh native/iroh/build.sh
          sh native/turso/build.sh
          sh native/capture/build.sh

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate secret; skipping keychain setup."
            exit 0
          fi
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12
          echo "APPLE_SIGNING_KEYCHAIN=$HOME/Library/Keychains/build.keychain-db" >> "$GITHUB_ENV"

      - name: Store notary credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_ID" ]; then
            echo "No notary credentials; skipping."
            exit 0
          fi
          if [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_ID is set, so APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are required"
            exit 1
          fi
          xcrun notarytool store-credentials NOTARY \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          echo "APPLE_NOTARY_PROFILE=NOTARY" >> "$GITHUB_ENV"

      - name: Package macOS desktop
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.WAKU_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MYGO_UPDATE_FEED_URL: https://s3.cheaprouter.cc/cheaprouter-releases/mygo
          MYGO_UPDATE_PUBLIC_KEY: ${{ secrets.MYGO_UPDATE_PUBLIC_KEY }}
          SAILRY_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE" ]; then
            export SAILRY_SIGNING=developer-id
            if [ -n "${APPLE_NOTARY_PROFILE:-}" ]; then
              export SAILRY_NOTARIZE=1
            fi
          else
            echo "::warning::No Apple certificate — building ad-hoc, unnotarized macOS artifacts."
            export SAILRY_SIGNING=ad-hoc
            export SAILRY_NOTARIZE=0
          fi
          ./cmd/sailry-desktop/macos/package.sh -arch "${{ matrix.arch }}" --require-update-key

      - name: Stage macOS release artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          out="desktop/.runtime/package/out/darwin-${ARCH}"
          mkdir -p dist-mygo
          if [ "$ARCH" = "arm64" ]; then
            cp "$out/CheapRouter-${TRIPLE}.dmg" "dist-mygo/CheapRouter-${VERSION}.dmg"
            cp "$out/CheapRouter-${TRIPLE}-unsigned.zip" "dist-mygo/CheapRouter-${VERSION}.zip"
          else
            cp "$out/CheapRouter-${TRIPLE}.dmg" "dist-mygo/CheapRouter-${VERSION}-x86_64.dmg"
            cp "$out/CheapRouter-${TRIPLE}-unsigned.zip" "dist-mygo/CheapRouter-${VERSION}-x86_64.zip"
          fi
          cp "$out/cheaprouter-${VERSION}-darwin-${ARCH}.tar.gz" "dist-mygo/cheaprouter-${VERSION}-darwin-${ARCH}.tar.gz"

      - name: Generate first-hop Sparkle appcast.xml
        if: matrix.primary_appcast
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          WAKU_DOWNLOAD_URL_PREFIX: https://s3.cheaprouter.cc/cheaprouter-releases/
        run: |
          set -euo pipefail
          sparkle_version="2.9.4"
          sparkle_sha256="ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9"
          sparkle_dir=".waku-cache/sparkle/${sparkle_version}"
          if [ ! -x "${sparkle_dir}/bin/generate_appcast" ]; then
            mkdir -p "${sparkle_dir}"
            curl -fsSL --retry 3 -o "${sparkle_dir}/Sparkle.tar.xz" \
              "https://github.com/sparkle-project/Sparkle/releases/download/${sparkle_version}/Sparkle-${sparkle_version}.tar.xz"
            echo "${sparkle_sha256}  ${sparkle_dir}/Sparkle.tar.xz" | shasum -a 256 -c -
            tar -xJf "${sparkle_dir}/Sparkle.tar.xz" -C "${sparkle_dir}" ./bin
            rm -f "${sparkle_dir}/Sparkle.tar.xz"
          fi

          bun -e '
            import { extractReleaseNotes } from "./scripts/changelog.ts";
            const version = process.env.VERSION;
            let notes = null;
            for (const path of ["CHANGELOG.md", "desktop/CHANGELOG.md"]) {
              const file = Bun.file(path);
              if (await file.exists()) {
                notes = extractReleaseNotes(await file.text(), version);
                if (notes) break;
              }
            }
            const body = `${notes ?? "See CHANGELOG.md for details."}\n`;
            await Bun.write(`dist-mygo/CheapRouter-${version}.md`, body);
          '

          mkdir -p dist-mygo/updates
          cp "dist-mygo/CheapRouter-${VERSION}.zip" "dist-mygo/updates/CheapRouter-${VERSION}.zip"
          cp "dist-mygo/CheapRouter-${VERSION}.md" "dist-mygo/updates/CheapRouter-${VERSION}.md"
          SPARKLE_BIN="${PWD}/${sparkle_dir}/bin" bun scripts/appcast.ts dist-mygo/updates
          cp dist-mygo/updates/appcast.xml dist-mygo/appcast.xml
          grep -q "CheapRouter-${VERSION}.zip" dist-mygo/appcast.xml
          grep -q 'sparkle:edSignature=' dist-mygo/appcast.xml

      - uses: actions/upload-artifact@v7
        if: matrix.primary_appcast
        with:
          name: mygo-macos-${{ matrix.arch }}
          path: |
            dist-mygo/CheapRouter-${{ needs.version.outputs.version }}.dmg
            dist-mygo/CheapRouter-${{ needs.version.outputs.version }}.zip
            dist-mygo/CheapRouter-${{ needs.version.outputs.version }}.md
            dist-mygo/appcast.xml
            dist-mygo/cheaprouter-${{ needs.version.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ !matrix.primary_appcast }}
        with:
          name: mygo-macos-${{ matrix.arch }}
          path: |
            dist-mygo/CheapRouter-${{ needs.version.outputs.version }}-x86_64.dmg
            dist-mygo/CheapRouter-${{ needs.version.outputs.version }}-x86_64.zip
            dist-mygo/cheaprouter-${{ needs.version.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  mygo-windows:
    name: MyGo Windows (${{ matrix.rust_arch }})
    needs: version
    if: needs.version.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_arch: x86_64
            triple: x86_64-pc-windows-msvc
            os: windows-latest
          - arch: arm64
            rust_arch: aarch64
            triple: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Verify required signing secrets
        shell: bash
        env:
          MYGO_UPDATE_PUBLIC_KEY: ${{ secrets.MYGO_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MYGO_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::MYGO_UPDATE_PUBLIC_KEY secret is required for MyGo desktop release"
            exit 1
          fi

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Install Rust (native libraries)
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add ${{ matrix.triple }}

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/.runtime/native/windows-${{ matrix.arch }}/cargo
            desktop/.runtime/native/windows-${{ matrix.arch }}/turso-cargo
          key: mygo-windows-${{ matrix.arch }}-rust-1.98.0-${{ hashFiles('desktop/native/iroh/Cargo.lock', 'desktop/native/turso/Cargo.lock') }}
          restore-keys: |
            mygo-windows-${{ matrix.arch }}-rust-1.98.0-

      - name: Build native libraries
        shell: bash
        working-directory: desktop
        env:
          SAILRY_ARCH: ${{ matrix.arch }}
        run: |
          sh native/iroh/build.sh
          sh native/turso/build.sh
          sh native/capture/build.sh

      - name: Stage Windows C++ runtime
        shell: pwsh
        working-directory: desktop
        run: |
          pwsh -File native/windows/crt.ps1 -Arch ${{ matrix.arch }} -Output .runtime/native/windows-${{ matrix.arch }}

      - name: Package Windows desktop (Inno Setup + zip + MyGo tar.gz)
        shell: bash
        working-directory: desktop
        env:
          SAILRY_ARCH: ${{ matrix.arch }}
          MYGO_UPDATE_FEED_URL: https://s3.cheaprouter.cc/cheaprouter-releases/mygo
          MYGO_UPDATE_PUBLIC_KEY: ${{ secrets.MYGO_UPDATE_PUBLIC_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SAILRY_REVISION: ${{ github.sha }}
        run: |
          ./cmd/sailry-desktop/windows/package.sh -arch "${{ matrix.arch }}" --require-update-key

      - uses: actions/upload-artifact@v7
        with:
          name: mygo-windows-${{ matrix.arch }}
          path: |
            desktop/.runtime/package/out/windows-${{ matrix.arch }}/CheapRouter-${{ needs.version.outputs.version }}-${{ matrix.rust_arch }}-Setup.exe
            desktop/.runtime/package/out/windows-${{ matrix.arch }}/cheaprouter-${{ needs.version.outputs.version }}-${{ matrix.triple }}.zip
            desktop/.runtime/package/out/windows-${{ matrix.arch }}/cheaprouter-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  mygo-draft-release:
    name: Draft MyGo GitHub release
    needs:
      [
        version,
        mygo-macos,
        mygo-windows,
      ]
    if: needs.version.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Verify required signing secrets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MYGO_UPDATE_PRIVATE_KEY: ${{ secrets.MYGO_UPDATE_PRIVATE_KEY }}
          MYGO_UPDATE_PUBLIC_KEY: ${{ secrets.MYGO_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in SPARKLE_PRIVATE_KEY MYGO_UPDATE_PRIVATE_KEY MYGO_UPDATE_PUBLIC_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret ${name} is not set"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify all platform artifacts landed
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for f in \
            "CheapRouter-${VERSION}.dmg" \
            "CheapRouter-${VERSION}.zip" \
            "CheapRouter-${VERSION}.md" \
            "appcast.xml" \
            "CheapRouter-${VERSION}-x86_64.dmg" \
            "CheapRouter-${VERSION}-x86_64.zip" \
            "CheapRouter-${VERSION}-x86_64-Setup.exe" \
            "CheapRouter-${VERSION}-aarch64-Setup.exe" \
            "cheaprouter-${VERSION}-x86_64-pc-windows-msvc.zip" \
            "cheaprouter-${VERSION}-aarch64-pc-windows-msvc.zip" \
            "cheaprouter-${VERSION}-darwin-arm64.tar.gz" \
            "cheaprouter-${VERSION}-darwin-amd64.tar.gz" \
            "cheaprouter-${VERSION}-windows-amd64.tar.gz" \
            "cheaprouter-${VERSION}-windows-arm64.tar.gz"; do
            if [ ! -f "artifacts/$f" ]; then
              echo "::error::Missing expected release artifact: artifacts/$f"
              exit 1
            fi
          done

      - name: Write version pointers and release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "$VERSION" > artifacts/latest-windows.txt
          bun -e '
            import { extractReleaseNotes } from "./scripts/changelog.ts";
            const version = process.env.VERSION;
            let notes = null;
            for (const path of ["CHANGELOG.md", "desktop/CHANGELOG.md"]) {
              const file = Bun.file(path);
              if (await file.exists()) {
                notes = extractReleaseNotes(await file.text(), version);
                if (notes) break;
              }
            }
            await Bun.write(
              "release-notes.md",
              `${notes ?? "See CHANGELOG.md for details."}\n`,
            );
          '

      - name: Sign first-hop Windows update feeds
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          WAKU_DOWNLOAD_URL_PREFIX: https://s3.cheaprouter.cc/cheaprouter-releases/
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            curl -fsSL --max-time 30 \
              "https://s3.cheaprouter.cc/cheaprouter-releases/appcast-windows-${arch}.xml" \
              -o "artifacts/appcast-windows-${arch}.xml" || true
          done
          bun scripts/appcast-windows.ts artifacts "$VERSION"
          for arch in x86_64 aarch64; do
            feed="artifacts/appcast-windows-${arch}.xml"
            test -s "$feed"
            grep -q "CheapRouter-${VERSION}-${arch}-Setup.exe" "$feed"
            grep -q 'sparkle:edSignature=' "$feed"
          done

      - name: Sign and verify second-hop MyGo manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MYGO_UPDATE_PRIVATE_KEY: ${{ secrets.MYGO_UPDATE_PRIVATE_KEY }}
          MYGO_UPDATE_PUBLIC_KEY: ${{ secrets.MYGO_UPDATE_PUBLIC_KEY }}
          MYGO_UPDATE_FEED_URL: https://s3.cheaprouter.cc/cheaprouter-releases/mygo
          CGO_ENABLED: "0"
          GOTOOLCHAIN: go1.27.3
        run: |
          set -euo pipefail
          mkdir -p prev-manifests
          for target in darwin-arm64 darwin-amd64 windows-amd64 windows-arm64; do
            curl -fsSL --max-time 30 \
              "${MYGO_UPDATE_FEED_URL}/update-${target}.json" \
              -o "prev-manifests/update-${target}.json" || true
          done
          (
            cd desktop
            go run ./cmd/mygo-manifest sign \
              -dir ../artifacts \
              -out ../artifacts \
              -prev-dir ../prev-manifests \
              -version "$VERSION" \
              -slug cheaprouter \
              -feed-url "$MYGO_UPDATE_FEED_URL" \
              -notes-file ../release-notes.md \
              -targets darwin-arm64,darwin-amd64,windows-amd64,windows-arm64 \
              -mygo-config cmd/sailry-desktop/mygo.json
            go run ./cmd/mygo-manifest verify \
              -dir ../artifacts \
              -targets darwin-arm64,darwin-amd64,windows-amd64,windows-arm64 \
              -mygo-config cmd/sailry-desktop/mygo.json
          )

      - name: Write SHA256SUMS.txt
        run: |
          set -euo pipefail
          (
            cd artifacts
            sha256sum \
              *.dmg \
              *.zip \
              *.exe \
              *.tar.gz \
              appcast.xml \
              appcast-windows-*.xml \
              update-*.json \
              > SHA256SUMS.txt
          )

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
