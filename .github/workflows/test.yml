name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # No Linux runner: this fork ships no Linux build.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-rust-1.96.0-cargo-

      - name: Run tests
        run: cargo test --locked

      # The generated protocol and browser client are platform-independent, so
      # one runner is enough to catch a drifted checked-in artifact.
      - name: Install JavaScript dependencies
        if: runner.os == 'macOS'
        run: bun install --frozen-lockfile

      - name: Check generated protocol and browser client
        if: runner.os == 'macOS'
        run: |
          bun run protocol:check
          bun run --filter @waku/client check
          bun run --filter @waku/client test
