name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-desktop:
    name: Go desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # No Linux runner: this fork ships no Linux build.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: go1.27.3

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache: true
          cache-dependency-path: go.sum

      - name: Run desktop tests
        run: go test ./...

      - name: Build desktop shell
        run: go build ./...
