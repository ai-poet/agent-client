[package]
name = "waku"
version = "0.1.21"
edition = "2024"
description = "A fast, native control plane for local coding agents"
license = "GPL-3.0-only"

[workspace]
members = [
    "crates/sub2api",
    "crates/workflow-engine",
    "crates/waku-agent-bridge",
    "crates/waku-agent/api",
    "crates/waku-agent/core",
    "crates/waku-agent/mcp",
    "crates/waku-agent/plugins",
    "crates/waku-agent/query",
    "crates/waku-agent/tools",
    "crates/waku-client",
    "crates/waku-core",
    "crates/waku-daemon",
    "crates/waku-protocol",
]
# The vendored engine under `crates/waku-agent` is deliberately absent here.
# It builds as a dependency of `waku-agent-bridge`, but a bare `cargo test`
# should not run 76k lines of upstream tests written against Claurst's own
# fixtures and environment — see docs/FORK.md.
default-members = [
    ".",
    "crates/sub2api",
    "crates/workflow-engine",
    "crates/waku-agent-bridge",
    "crates/waku-client",
    "crates/waku-core",
    "crates/waku-daemon",
    "crates/waku-protocol",
]
resolver = "2"

# Dependencies of the vendored agent engine (`crates/waku-agent/**`), which
# declares every one of them as `{ workspace = true }`. Keeping the versions
# exactly as Claurst pinned them is what lets that tree stay a clean subtree —
# the two deliberate departures are called out below.
[workspace.dependencies]
claurst-api = { path = "crates/waku-agent/api" }
claurst-core = { path = "crates/waku-agent/core" }
claurst-mcp = { path = "crates/waku-agent/mcp" }
claurst-plugins = { path = "crates/waku-agent/plugins" }
claurst-query = { path = "crates/waku-agent/query" }
claurst-tools = { path = "crates/waku-agent/tools" }

anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
dirs = "5"
futures = "0.3"
getrandom = "0.2"
glob = "0.3"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"
open = "5"
parking_lot = "0.12"
regex = "1"
# rustls rather than native-tls/openssl: the engine has to coexist with GPUI's
# own reqwest, and a second TLS backend would mean a second C toolchain
# prerequisite on every machine that builds Waku.
reqwest = { version = "0.13", features = [
    "json",
    "stream",
    "rustls",
    "multipart",
    "form",
    "query",
], default-features = false }
# Fork departure: Claurst pins 0.31. `waku-core` already links 0.37, and
# `libsqlite3-sys` declares `links = "sqlite3"`, so two versions cannot
# coexist in one binary. Every call site the engine has (`Connection::open`,
# `execute_batch`, `execute`, `prepare`, `query_map`, `params!`) is unchanged
# across the range.
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.44", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "0.8"
tracing = "0.1"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
which = "7"

# Off by default and left that way: Computer Use is Waku's own (the macOS
# Swift helper and `cua-driver` elsewhere), and voice input has no surface in
# a GPUI client. Listed because the vendored manifests reference them behind
# `optional = true`.
enigo = "0.2"
image = { version = "0.25", features = ["png", "jpeg"] }
xcap = "0.0.13"

# Unix-only, declared by `waku-agent/tools` under its own `cfg(unix)` block.
nix = { version = "0.29", features = ["process", "signal", "user"] }

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "6.0"
# The egoist/zed fork is upstream main plus PR #61945 (layered scene
# rendering), which lets GPUI composite menus and tooltips above native child
# views — the browser surface's WKWebView. Drop back to upstream once the PR
# merges.
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview" }
gpui_platform = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
    "font-kit",
    "wayland",
    "x11",
] }
parking_lot = "0.12"
# Fork addition: renders the top-up QR code natively (bit matrix only, no
# image backend).
qrcode = { version = "0.14", default-features = false }
rquickjs = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sub2api = { path = "crates/sub2api" }
workflow-engine = { path = "crates/workflow-engine" }
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-client = { path = "crates/waku-client" }
waku-protocol = { path = "crates/waku-protocol" }
pulldown-cmark = "0.13"
regex = "1"
rust-i18n = "4"
rust-umami = "0.1.1"
smol = "2"
ropey = "=2.0.0-beta.1"
futures-lite = "2"
futures = "0.3"
nucleo-matcher = "0.3.1"
tokio = { version = "1", features = ["rt"] }

# `test-support` has to stay test-only. It compiles a loop into gpui's
# `flush_effects` that draws every dirty window right there, so with the
# feature on a shipping build every notify pays a full frame the moment it
# happens instead of coalescing into the display link's next one — a panel
# resize drew once per mouse-move event rather than once per displayed frame.
[dev-dependencies]
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
    "test-support",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.56", features = ["devtools"] }
block2 = "0.6"
# Matches the version GPUI itself renders with, so RenderImage frames are the
# same `image` types.
image = "0.25"
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGImage",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKWebView",
    "WKSnapshotConfiguration",
] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSCell",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSLocale",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Matches the version GPUI exposes through `WindowOptions::icon`.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
# The browser surface. WebView2 is evergreen on Windows 10 and in-box on 11.
# Waku drives it through `webview2-com` rather than wry because it needs the
# *composition* controller, which renders into a DirectComposition visual
# instead of a child HWND — see `browser::host` for why, and note that only
# the environment can create one, so it cannot be reached from wry's
# `WebViewExtWindows` after the fact.
webview2-com = "0.38"
# Same version GPUI is built against, so the portal's `IDCompositionVisual`
# hands straight to `SetRootVisualTarget` with no ABI bridging. `windows-sys`
# stays for the plain Win32 calls that do not need COM.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
# GPUI does not read the Windows animation preference, so Waku asks
# `SystemParametersInfoW` itself. Same major version as the one already in the
# graph through GPUI.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Verifies the EdDSA signatures `generate_appcast` writes, so the Windows
# updater trusts the same key Sparkle does on macOS.
ed25519-dalek = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug assertions and incremental builds for app code, but do not run
# GPUI's text shaping and Taffy layout hot paths completely unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `block` 0.1.6 declares an extern static with an uninhabited type. This fork
# is the crates.io release plus the future-incompatibility fix only.
[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
