[package]
name = "agent-trajectory"
version = "0.1.0"
edition = "2024"
description = "Trajectory for the built-in agent: the timed record of every model request and tool call, and the ledger and timeline built from it"
license = "GPL-3.0-only"

# Pure logic: no async runtime, no GPUI, no upstream crate. The bridge writes
# the record (`crates/waku-agent-bridge/src/trajectory.rs`), the app reads and
# draws it (`src/app/trajectory_panel.rs`). The ledger model, the timeline
# projection and the timing rules are translated from DeepSeek Harness's
# `ui-trajectory` (MIT); see NOTICE.md.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
