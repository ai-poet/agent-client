[package]
name = "workflow-engine"
version = "0.1.0"
edition = "2024"
description = "Staged multi-agent workflows for the Waku fork: the run graph and scheduler, the planner, and the objective check"
license = "GPL-3.0-only"

[dependencies]
# Gateway HTTP client, base-URL rules, data directory, and the process
# helper with a timeout — the fork's shared plumbing, nothing UI-facing.
sub2api = { path = "../sub2api" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
