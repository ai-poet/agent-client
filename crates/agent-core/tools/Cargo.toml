[package]
name = "agent-core-tools"
version = "0.1.7"
edition = "2021"

[dependencies]
agent-core = { workspace = true }
agent-core-api = { workspace = true }
agent-core-mcp = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
walkdir = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
bytes = { workspace = true }
# Full-content file revisions (Sailry-style BLAKE3 hashes) for Read/Edit/Write
# structured results.
blake3 = "1.8"
uuid = { workspace = true }
chrono = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
which = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
open = { workspace = true }
enigo = { workspace = true, optional = true }
xcap = { workspace = true, optional = true }
image = { workspace = true }

# PTY support — used by PtyBashTool on Unix
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
# Used by PtyBashTool to poll the PTY master fd so the read loop can stop as soon
# as the direct child exits instead of hanging on a detached grandchild (#220/#184).
libc = "0.2"

[features]
computer-use = ["dep:enigo", "dep:xcap"]
