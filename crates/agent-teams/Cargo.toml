[package]
name = "agent-teams"
version = "0.1.0"
edition = "2024"
description = "AgentTeams for the built-in agent: durable team state, scheduling rules, quality gates and prompts"
license = "GPL-3.0-only"

# Pure logic: no async runtime, no GPUI, no upstream crate. The bridge drives
# it (`crates/waku-agent-bridge/src/team/`), the app draws it
# (`src/app/team_panel.rs`) and `sub2api` stores its settings. Much of it is
# translated from `@nanmicoder/dsh-agent-teams` (MIT); see NOTICE.md.
[dependencies]
anyhow = "1.0"
parking_lot = "0.12"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
